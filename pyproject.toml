[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-ai-copilot"
version = "0.1.0"
description = "Finance AI Copilot v0.1 POC skeleton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "python-docx>=1.1",
    "python-multipart>=0.0.10",
    "pymupdf>=1.24",
    "streamlit>=1.36",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.2"]
provider = ["openai>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
